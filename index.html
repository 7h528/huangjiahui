<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珠海科技学院校园活动聚合站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>珠海科技学院校园活动聚合站</h1>
            <p>校内竞赛、讲座、社团招募、学习小组信息一站式浏览</p>
        </header>

        <div class="filter-box">
            <label>筛选活动类型：</label>
            <select id="typeFilter">
                <option value="all">全部活动</option>
                <option value="竞赛">竞赛</option>
                <option value="讲座">讲座/分享会</option>
                <option value="招募">团队/社团招募</option>
                <option value="学习小组">学习小组</option>
                <option value="志愿">志愿活动</option>
            </select>
            <input type="text" id="searchInput" placeholder="搜索活动名称/简介">
        </div>

        <section class="activity-list" id="activityList">
            <!-- 活动卡片由js渲染 -->
        </section>

        <hr>
        <h2>发布新活动</h2>
        <form id="publishForm">
            <div class="form-item">
                <label>活动标题</label>
                <input type="text" id="title" required placeholder="例如：蓝桥杯程序设计校内训练营">
            </div>
            <div class="form-item">
                <label>活动类型</label>
                <select id="actType">
                    <option value="竞赛">竞赛</option>
                    <option value="讲座">讲座/分享会</option>
                    <option value="招募">团队/社团招募</option>
                    <option value="学习小组">学习小组</option>
                    <option value="志愿">志愿活动</option>
                </select>
            </div>
            <div class="form-item">
                <label>发布方</label>
                <select id="publisher">
                    <option value="学校官方">珠海科技学院（院系/社团官方）</option>
                    <option value="学生自发">学生个人发起</option>
                </select>
            </div>
            <div class="form-item">
                <label>报名截止日期</label>
                <input type="datetime-local" id="deadline" required>
            </div>
            <div class="form-item">
                <label>活动简介</label>
                <textarea id="desc" rows="4" required placeholder="填写活动内容、面向人群、地点等"></textarea>
            </div>
            <button type="submit">提交发布</button>
        </form>
        <footer>
            <p>珠海科技学院 | 校园活动聚合平台 · 计算机协会项目</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
